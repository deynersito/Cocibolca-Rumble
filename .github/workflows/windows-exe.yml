name: Compilar Cocibolca Rumble para Windows

on:
  push:
    paths:
      - '.github/workflows/windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Preparar compilador
        run: python -m pip install pygame-ce==2.5.8 "pyinstaller>=6.16,<7" "pillow>=11,<13"

      - name: Descargar y verificar el paquete publicado
        shell: python
        run: |
          import hashlib, pathlib, urllib.request, zipfile
          url = "https://github.com/deynersito/Cocibolca-Rumble/releases/download/v0.24/Cocibolca-Rumble-PC-0.24.zip"
          urllib.request.urlretrieve(url, "source.zip")
          digest = hashlib.sha256(pathlib.Path("source.zip").read_bytes()).hexdigest()
          assert digest == "8ad9c98f55459d898fd08d65058f9a367b4c4c0226cba09cded96b59468a6e54", digest
          with zipfile.ZipFile("source.zip") as archive:
              archive.extractall("source")
          games = list(pathlib.Path("source").glob("*/game.py"))
          assert len(games) == 1
          root = games[0].parent
          game = games[0].read_text(encoding="utf-8")
          game = game.replace("str(ROOT/'combate-024.png')", "os.environ.get('COCIBOLCA_SMOKE_IMAGE',str(ROOT/'combate-024.png'))")
          games[0].write_text(game, encoding="utf-8")
          updates = root / "updates.py"
          updates.write_text(updates.read_text(encoding="utf-8").replace("Cocibolca-Rumble-PC-", "Cocibolca-Rumble-(?:PC|Windows)-"), encoding="utf-8")
          pathlib.Path("game-path.txt").write_text(str(root.resolve()), encoding="utf-8")
          from PIL import Image, ImageDraw, ImageFont
          icon = Image.new("RGBA", (256,256), (0,0,0,0))
          draw = ImageDraw.Draw(icon)
          draw.rounded_rectangle((6,6,250,250), radius=46, fill=(8,30,58), outline=(250,199,77), width=9)
          font = ImageFont.truetype("C:/Windows/Fonts/arialbd.ttf", 157)
          draw.text((128,120), "C", font=font, fill=(250,199,77), anchor="mm", stroke_width=1)
          draw.line((55,211,201,211), fill=(69,217,237), width=10)
          icon.save("cocibolca.ico", sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])

      - name: Compilar ejecutable independiente
        shell: pwsh
        run: |
          $gameRoot = (Get-Content game-path.txt -Raw).Trim()
          python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx --name "Cocibolca Rumble" --icon cocibolca.ico --add-data "$gameRoot/assets;assets" --paths "$gameRoot" "$gameRoot/game.py"
          if ($LASTEXITCODE -ne 0) { throw "Fallo de compilacion" }

      - name: Probar el EXE en Windows
        shell: pwsh
        run: |
          $env:SDL_VIDEODRIVER = "dummy"
          $env:SDL_AUDIODRIVER = "dummy"
          $env:COCIBOLCA_SMOKE_IMAGE = "$env:GITHUB_WORKSPACE/smoke-windows.png"
          $env:COCIBOLCA_CONFIG = "$env:RUNNER_TEMP/cocibolca-controls.json"
          $env:COCIBOLCA_AUDIO_CONFIG = "$env:RUNNER_TEMP/cocibolca-audio.json"
          $process = Start-Process -FilePath "./dist/Cocibolca Rumble.exe" -ArgumentList "--smoke" -PassThru
          if (-not $process.WaitForExit(180000)) {
            Stop-Process -Id $process.Id -Force
            throw "El ejecutable no termino la prueba"
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "El ejecutable fallo: $($process.ExitCode)" }
          if (-not (Test-Path $env:COCIBOLCA_SMOKE_IMAGE)) { throw "No se genero la captura de prueba" }
          python -c "from PIL import Image; im=Image.open('smoke-windows.png'); assert im.size==(1280,720); print('EXE Windows: arranque, menus, combate y render correctos')"

      - name: Empaquetar la version para jugadores
        shell: python
        run: |
          import hashlib, pathlib, zipfile
          exe = pathlib.Path("dist/Cocibolca Rumble.exe")
          assert exe.read_bytes()[:2] == b"MZ"
          instructions = """COCIBOLCA RUMBLE 0.24 - WINDOWS 64 BITS
          
          Abri Cocibolca Rumble.exe con doble clic.
          No necesitas instalar Python ni ejecutar archivos BAT.
          El ejecutable incluye imagenes, sonidos y dependencias.
          
          Conserva PvP local, PvB, 12 personajes, 4 mapas y controles guardados.
          Los controles y el volumen se guardan en tu perfil de Windows.
          Actualizaciones abre las descargas de GitHub en el navegador.
          
          Compilado y probado en Windows mediante GitHub Actions.
          Ejecutable sin firma digital de editor.
          """
          with zipfile.ZipFile("Cocibolca-Rumble-Windows-0.24.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              archive.write(exe, "Cocibolca Rumble.exe")
              archive.writestr("LEEME.txt", instructions)
          digest = hashlib.sha256(exe.read_bytes()).hexdigest()
          pathlib.Path("SHA256.txt").write_text(digest + "  Cocibolca Rumble.exe\n", encoding="utf-8")

      - uses: actions/upload-artifact@v4
        with:
          name: Cocibolca-Rumble-Windows-0.24
          path: |
            Cocibolca-Rumble-Windows-0.24.zip
            SHA256.txt
            smoke-windows.png
          retention-days: 30
          if-no-files-found: error
